<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
 <!-- App icon: a simpler version of the logo - a heart card with a die in front, in the same cartoon style. Fits inside Android's round crop. -->
 <g transform="translate(64 64) scale(0.781) translate(-63.25 -63.50)">
<g stroke="#1E1A4D" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
  <!-- Ground shadow -->
  <ellipse cx="66" cy="99" rx="30" ry="5" fill="#1E1A4D" opacity="0.3" stroke="none" />
  <!-- The card (heart), tilted to the left -->
  <g transform="rotate(-14 56 58)">
    <rect x="34" y="28" width="44" height="60" rx="7" fill="#FFFFFF" />
    <path d="M56 72 C45 64 41 59 41 53 C41 48 45 44 50 44 C53 44 55 46 56 48 C57 46 59 44 62 44 C67 44 71 48 71 53 C71 59 67 64 56 72 Z" fill="#E5484D" stroke-width="3" />
    <path d="M40 34.5 V43 M45 34.5 L40.6 38.7 L45 43" fill="none" stroke="#E5484D" stroke-width="3" />
  </g>
  <!-- The die in front, overlapping the card -->
  <g transform="rotate(12 80 78)">
    <rect x="64" y="62" width="32" height="32" rx="7" fill="#F6A75E" />
    <circle cx="71.5" cy="69.5" r="3.4" fill="#1E1A4D" stroke="none" />
    <circle cx="88.5" cy="69.5" r="3.4" fill="#1E1A4D" stroke="none" />
    <circle cx="80" cy="78" r="3.4" fill="#1E1A4D" stroke="none" />
    <circle cx="71.5" cy="86.5" r="3.4" fill="#1E1A4D" stroke="none" />
    <circle cx="88.5" cy="86.5" r="3.4" fill="#1E1A4D" stroke="none" />
  </g>
  <!-- A little sparkle -->
  <path d="M91 30 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z" fill="#FFD166" stroke-width="2.5" />
</g>
 </g>
</svg>
