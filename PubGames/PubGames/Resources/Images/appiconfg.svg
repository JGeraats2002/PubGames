    <path d="M50 37 l3 4 l-3 4 l-3 -4 Z" fill="#3C3489" opacity="0.55" />
  </g>
  <g transform="translate(4 -4) rotate(10 74 50)">
    <rect x="60" y="29" width="27" height="38" rx="4" fill="#FFFFFF" />
    <path d="M73.5 53.5 c-6 -4.2 -8 -6.6 -8 -9.2 c0 -2.2 1.7 -3.8 3.8 -3.8 c1.8 0 3.2 1 4.2 2.6 c1 -1.6 2.4 -2.6 4.2 -2.6 c2.1 0 3.8 1.6 3.8 3.8 c0 2.6 -2 5 -8 9.2 Z" fill="#C0392B" opacity="0.85" />
