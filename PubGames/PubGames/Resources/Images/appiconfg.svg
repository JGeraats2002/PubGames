    <circle cx="83.5" cy="77.5" r="1.9" fill="#3C3489" />
    <circle cx="88" cy="82" r="1.9" fill="#3C3489" />
    <circle cx="92.5" cy="86.5" r="1.9" fill="#3C3489" />
  </g>
  <g transform="rotate(-12 76 98)">
    <rect x="69" y="91" width="14" height="14" rx="3.2" fill="#F1EFE8" />
    <circle cx="72.8" cy="94.8" r="1.5" fill="#3C3489" />
